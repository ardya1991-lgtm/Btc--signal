<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BTC Signal">
<title>BTC Signal — Polymarket 5Min</title>
<link rel="manifest" href="#" id="manifest-link">
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap');

:root {
  --bg:     #070b14;
  --panel:  #111827;
  --border: #1e2d45;
  --up:     #00e5a0;
  --down:   #ff4060;
  --wait:   #f5a623;
  --blue:   #3d9bff;
  --text:   #e2eaf5;
  --muted:  #4a6080;
  --mono:   'Share Tech Mono', monospace;
  --cond:   'Barlow Condensed', sans-serif;
  --sans:   'Barlow', sans-serif;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow-x:hidden;overscroll-behavior:none}

body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.07) 2px,rgba(0,0,0,0.07) 4px);pointer-events:none;z-index:999}
body::after{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(61,155,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(61,155,255,0.04) 1px,transparent 1px);background-size:32px 32px;pointer-events:none;z-index:0}

.app{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;padding-bottom:28px;max-width:480px;margin:0 auto}

/* HEADER */
.header{padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(7,11,20,0.92);position:sticky;top:0;z-index:10;backdrop-filter:blur(12px)}
.hlogo{width:34px;height:34px;background:linear-gradient(135deg,#00e5a0,#3d9bff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-weight:900;font-size:18px;color:#070b14;margin-right:10px}
.htitle{font-family:var(--cond);font-weight:900;font-size:17px;letter-spacing:1px;line-height:1}
.hsub{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px}
.hleft{display:flex;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.dot.live{background:var(--up);animation:blink 2s infinite}
.dot.err{background:var(--down)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}

/* CARDS */
.card{margin:10px 14px 0;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:14px 16px;position:relative;overflow:hidden}
.card-accent::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--up))}

/* PRICE */
.plabel{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px}
.pval{font-family:var(--cond);font-size:40px;font-weight:900;letter-spacing:-1px;line-height:1;color:#fff}
.pval span{font-size:20px;color:var(--muted)}
.pmeta{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.pm{display:flex;flex-direction:column;gap:2px}
.pml{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.pmv{font-family:var(--mono);font-size:13px}
.pmv.up{color:var(--up)}.pmv.dn{color:var(--down)}

/* TIMER */
.trow{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px}
.tval{font-family:var(--mono);font-size:22px;font-weight:700;color:#fff}
.tval.urg{color:var(--down)}.tval.wrn{color:var(--wait)}.tval.ok{color:var(--up)}
.track{height:6px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--up));transition:width .5s}

/* SIGNAL */
.sig-card{margin:10px 14px 0;border-radius:14px;padding:18px 16px;border:2px solid var(--border);background:var(--panel);transition:border-color .4s,background .4s}
.sig-card.sup{border-color:var(--up);background:rgba(0,229,160,0.06)}
.sig-card.sdn{border-color:var(--down);background:rgba(255,64,96,0.06)}
.sig-card.swt{border-color:var(--wait);background:rgba(245,166,35,0.04)}

.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:999px;font-family:var(--cond);font-weight:900;font-size:12px;letter-spacing:2px;text-transform:uppercase;margin-bottom:12px}
.badge.up{background:rgba(0,229,160,0.15);color:var(--up);border:1px solid rgba(0,229,160,0.3)}
.badge.dn{background:rgba(255,64,96,0.15);color:var(--down);border:1px solid rgba(255,64,96,0.3)}
.badge.wt{background:rgba(245,166,35,0.15);color:var(--wait);border:1px solid rgba(245,166,35,0.3)}

.sigdir{font-family:var(--cond);font-weight:900;font-size:48px;letter-spacing:-2px;line-height:1;margin-bottom:5px}
.sigdir.up{color:var(--up)}.sigdir.dn{color:var(--down)}.sigdir.wt{color:var(--wait)}
.sigsub{font-size:12px;color:var(--muted);margin-bottom:13px}

.crow{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.clabel{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
.cpct{font-family:var(--mono);font-size:14px;font-weight:700}
.ctrack{height:7px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden}
.cfill{height:100%;border-radius:4px;transition:width .6s}
.cfill.up{background:var(--up)}.cfill.dn{background:var(--down)}.cfill.wt{background:var(--wait)}

/* MARKET PRICES */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pbox{background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:10px;padding:12px;text-align:center}
.pbox.upb{border-color:rgba(0,229,160,0.25)}.pbox.dnb{border-color:rgba(255,64,96,0.25)}
.pblabel{font-family:var(--cond);font-weight:700;font-size:11px;letter-spacing:2px;margin-bottom:5px}
.pblabel.up{color:var(--up)}.pblabel.dn{color:var(--down)}
.pbval{font-family:var(--mono);font-size:20px;font-weight:700;color:#fff}
.pbprob{font-family:var(--mono);font-size:11px;color:var(--muted);margin-top:2px}
.payout{margin-top:10px;background:rgba(255,255,255,0.03);border-radius:8px;padding:9px 12px;font-family:var(--mono);font-size:12px;color:var(--text);text-align:center}
.payout b{color:var(--up)}

/* INDICATORS */
.igrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.iitem{background:rgba(255,255,255,0.03);border-radius:8px;padding:10px}
.iname{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px}
.ival{font-family:var(--mono);font-size:16px;font-weight:700}
.ival.bull{color:var(--up)}.ival.bear{color:var(--down)}.ival.neut{color:var(--wait)}
.idesc{font-size:10px;color:var(--muted);margin-top:2px}

/* LINK */
.lcard{margin:10px 14px 0;background:rgba(61,155,255,0.06);border:1px solid rgba(61,155,255,0.2);border-radius:14px;padding:13px 16px;display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:var(--blue);transition:background .2s}
.lcard:active{background:rgba(61,155,255,0.12)}
.ltext{font-family:var(--mono);font-size:12px}
.ltext small{display:block;font-size:9px;color:var(--muted);letter-spacing:1px;margin-bottom:2px}

/* BUTTON */
.rbtn{margin:12px 14px 0;width:calc(100% - 28px);padding:14px;background:linear-gradient(135deg,rgba(0,229,160,0.15),rgba(61,155,255,0.15));border:1px solid rgba(0,229,160,0.3);border-radius:14px;color:var(--up);font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px}
.rbtn:active{transform:scale(0.98)}.rbtn:disabled{opacity:0.5;cursor:not-allowed}

.lupdate{text-align:center;font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:10px;letter-spacing:1px}

/* LOADING */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:18px}
.spinner{width:42px;height:42px;border:3px solid rgba(0,229,160,0.2);border-top-color:var(--up);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ltxt{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:2px;animation:blink 1.2s infinite}

/* ERROR */
.errbox{margin:16px;background:rgba(255,64,96,0.08);border:1px solid rgba(255,64,96,0.3);border-radius:14px;padding:18px;text-align:center}
.errico{font-size:26px;margin-bottom:8px}
.errmsg{font-size:13px;color:#ff8099;margin-bottom:14px;line-height:1.6}

.sec-title{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.fade-in{animation:fi .4s ease}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="hleft">
      <div class="hlogo">₿</div>
      <div>
        <div class="htitle">BTC SIGNAL</div>
        <div class="hsub">POLYMARKET 5-MIN</div>
      </div>
    </div>
    <div class="dot" id="dot"></div>
  </div>
  <div class="loading" id="loadView">
    <div class="spinner"></div>
    <div class="ltxt">MENGAMBIL DATA...</div>
  </div>
  <div id="main" style="display:none"></div>
</div>

<script>
// ── PWA Manifest ──
const mf={name:"BTC Signal — Polymarket 5Min",short_name:"BTC Signal",start_url:location.href,display:"standalone",background_color:"#070b14",theme_color:"#0a0e1a",icons:[{src:"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='36' fill='%230d1220'/><text x='96' y='135' font-family='Arial Black' font-size='115' text-anchor='middle' fill='%2300e5a0'>₿</text></svg>`),sizes:"192x192",type:"image/svg+xml"},{src:"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='80' fill='%230d1220'/><text x='256' y='360' font-family='Arial Black' font-size='300' text-anchor='middle' fill='%2300e5a0'>₿</text></svg>`),sizes:"512x512",type:"image/svg+xml"}]};
const mb=new Blob([JSON.stringify(mf)],{type:'application/json'});
document.getElementById('manifest-link').href=URL.createObjectURL(mb);

// ── CONFIG ──
const MIN_CONF=60;

// ── API LIST — dicoba satu per satu sampai berhasil ──
const BTC_APIS=[
  // 1. Binance (paling cepat)
  async()=>{const r=await fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT',{mode:'cors'});const d=await r.json();return parseFloat(d.price)},
  // 2. CoinGecko
  async()=>{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd');const d=await r.json();return d.bitcoin.usd},
  // 3. Kraken
  async()=>{const r=await fetch('https://api.kraken.com/0/public/Ticker?pair=XBTUSD');const d=await r.json();return parseFloat(d.result.XXBTZUSD.c[0])},
  // 4. Coinbase
  async()=>{const r=await fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot');const d=await r.json();return parseFloat(d.data.amount)},
  // 5. CryptoCompare
  async()=>{const r=await fetch('https://min-api.cryptocompare.com/data/price?fsym=BTC&tsyms=USD');const d=await r.json();return d.USD},
];

const CANDLE_APIS=[
  // CryptoCompare 1m candle
  async()=>{const r=await fetch('https://min-api.cryptocompare.com/data/v2/histominute?fsym=BTC&tsym=USD&limit=30');const d=await r.json();if(d.Response!=='Success')throw new Error('fail');return d.Data.Data},
  // Binance klines
  async()=>{const r=await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=30',{mode:'cors'});const rows=await r.json();return rows.map(k=>({time:k[0]/1000,open:parseFloat(k[1]),close:parseFloat(k[4])}))},
];

async function tryApis(apis){
  for(const fn of apis){
    try{const v=await fn();if(v) return v}catch(e){}
  }
  return null;
}

// ── STATE ──
let S={price:null,open:null,candles:[],upP:null,downP:null,slug:'',updated:null,analysis:null,winStart:0,secLeft:300,loading:true};

// ── WINDOW ──
function getWin(){const n=Math.floor(Date.now()/1000);const s=n-(n%300);return{start:s,close:s+300,sec:s+300-n}}

// ── ANALISA ──
function rsi(cls,p=14){
  if(cls.length<p+1)return 50;
  let g=0,l=0;
  for(let i=cls.length-p;i<cls.length;i++){const d=cls[i]-cls[i-1];d>0?g+=d:l-=d}
  if(l===0)return 100;
  return 100-(100/(1+(g/p)/(l/p)));
}
function ema(cls,p){
  if(cls.length<p)return cls[cls.length-1]||0;
  const k=2/(p+1);let e=cls.slice(0,p).reduce((a,b)=>a+b)/p;
  for(let i=p;i<cls.length;i++)e=cls[i]*k+e*(1-k);
  return e;
}
function analyze(candles,price,openP){
  if(!candles.length||candles.length<15||!openP)return null;
  const cls=candles.map(c=>parseFloat(c.close||c[4]||c)).concat([price]);
  let sc=0;
  const dp=(price-openP)/openP*100;
  sc+=Math.max(-40,Math.min(40,dp*200));
  const r=rsi(cls);
  if(r>70)sc-=15;else if(r<30)sc+=15;else if(r>55)sc+=10;else if(r<45)sc-=10;
  sc+=ema(cls,5)>ema(cls,13)?15:-15;
  if(cls.length>=6){const m=(cls[cls.length-1]-cls[cls.length-6])/cls[cls.length-6]*100;sc+=Math.max(-20,Math.min(20,m*50))}
  sc=Math.max(-100,Math.min(100,sc));
  return{score:sc,conf:Math.abs(sc),rsi:r,e5:ema(cls,5),e13:ema(cls,13),dp};
}

// ── POLYMARKET ──
async function fetchMarket(){
  try{
    const r=await fetch('https://gamma-api.polymarket.com/markets?active=true&closed=false&limit=100');
    const ms=await r.json();
    for(const m of ms){
      const t=((m.slug||'')+(m.question||'')).toLowerCase();
      if((t.includes('bitcoin')||t.includes('btc'))&&(t.includes('5m')||t.includes('5 min')||t.includes('5-min'))&&(t.includes('up or down')||t.includes('updown')))return m;
    }
  }catch(e){}
  return null;
}
async function fetchMid(tid){
  try{const r=await fetch('https://clob.polymarket.com/midpoint?token_id='+tid);const d=await r.json();return parseFloat(d.mid)}catch{return null}
}

// ── FETCH ALL ──
async function fetchAll(){
  setDot('');
  try{
    const[price,candles,market]=await Promise.all([tryApis(BTC_APIS),tryApis(CANDLE_APIS),fetchMarket()]);
    if(!price)throw new Error('Semua sumber harga BTC gagal. Cek koneksi internet.');

    S.price=price;
    S.candles=candles||[];
    S.updated=new Date();

    const w=getWin();
    S.winStart=w.start;
    S.secLeft=w.sec;

    // Cari open price dari candle
    if(S.candles.length){
      for(const c of S.candles){if((c.time||0)>=w.start){S.open=parseFloat(c.open);break}}
      if(!S.open)S.open=price;
    }else S.open=price;

    S.analysis=analyze(S.candles,price,S.open);

    if(market){
      S.slug=market.slug||'';
      let toks=market.clobTokenIds,outs=market.outcomes;
      try{if(typeof toks==='string')toks=JSON.parse(toks);if(typeof outs==='string')outs=JSON.parse(outs)}catch{}
      if(toks&&toks.length>=2){
        let ui=0,di=1;
        if(outs)outs.forEach((o,i)=>{if(o.toLowerCase().includes('up'))ui=i;else if(o.toLowerCase().includes('down'))di=i});
        const[up,dn]=await Promise.all([fetchMid(toks[ui]),fetchMid(toks[di])]);
        S.upP=up;S.downP=dn;
      }
    }
    S.loading=false;
    setDot('live');
  }catch(e){
    S.loading=false;
    S.error=e.message;
    setDot('err');
  }
  render();
}

function setDot(c){const d=document.getElementById('dot');if(d)d.className='dot'+(c?' '+c:'')}

// ── TIMER ──
let lastWinStart=0;
function startTimer(){
  setInterval(()=>{
    const w=getWin();
    S.secLeft=w.sec;
    if(w.start!==lastWinStart){lastWinStart=w.start;fetchAll()}
    else updateTimer();
  },1000);
}
function updateTimer(){
  const el=document.getElementById('tv');const fl=document.getElementById('pf');
  if(!el||!fl)return;
  const s=S.secLeft,m=Math.floor(s/60),sc=s%60;
  el.textContent=`${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
  el.className='tval '+(s<=30?'urg':s<=60?'wrn':'ok');
  fl.style.width=`${(300-s)/300*100}%`;
}

// ── RENDER ──
function render(){
  document.getElementById('loadView').style.display='none';
  const main=document.getElementById('main');
  main.style.display='block';

  if(S.error&&!S.price){
    main.innerHTML=`
      <div class="errbox fade-in">
        <div class="errico">⚠️</div>
        <div class="errmsg">${S.error}</div>
        <button class="rbtn" onclick="manualRefresh()" style="margin:0;width:100%">🔄 COBA LAGI</button>
      </div>`;
    return;
  }

  const{price,open,analysis,upP,downP,slug,updated,secLeft}=S;
  const diff=price&&open?price-open:0;
  const diffPct=open?diff/open*100:0;
  const up=diff>=0;

  let sc='swt',bc='wt',bl='TUNGGU',sd='❓ TUNGGU',sdc='wt',cc='wt';
  if(analysis&&analysis.conf>=MIN_CONF){
    if(analysis.score>0){sc='sup';bc='up';bl='BELI UP';sd='⬆ UP';sdc='up';cc='up'}
    else{sc='sdn';bc='dn';bl='BELI DOWN';sd='⬇ DOWN';sdc='dn';cc='dn'}
  }
  const conf=analysis?analysis.conf:0;
  const r=analysis?analysis.rsi:50;
  const emab=analysis?analysis.e5>analysis.e13:false;
  const tStr=updated?updated.toLocaleTimeString('id-ID'):'-';
  const m=Math.floor(secLeft/60),sec=secLeft%60;
  const tCls=secLeft<=30?'urg':secLeft<=60?'wrn':'ok';
  const prog=(300-secLeft)/300*100;

  let payH='';
  if(analysis&&analysis.conf>=MIN_CONF){
    const px=analysis.score>0?upP:downP;
    if(px){const p=((1/px-1)*100).toFixed(0);payH=`<div class="payout">Modal $1 → menang dapat <b>$${(1/px).toFixed(2)}</b> (+${p}%)</div>`}
  }

  main.innerHTML=`
  <div class="card card-accent fade-in">
    <div class="plabel">BTC / USD  LIVE</div>
    <div class="pval"><span>$</span>${price?price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'---'}</div>
    <div class="pmeta">
      <div class="pm"><div class="pml">Open 5m</div><div class="pmv">$${open?open.toLocaleString('en-US',{minimumFractionDigits:2}):'---'}</div></div>
      <div class="pm"><div class="pml">Selisih</div><div class="pmv ${up?'up':'dn'}">${up?'▲':'▼'} ${Math.abs(diffPct).toFixed(3)}%</div></div>
      <div class="pm"><div class="pml">RSI 14</div><div class="pmv">${r.toFixed(0)}</div></div>
    </div>
  </div>

  <div class="card fade-in">
    <div class="trow">
      <div class="plabel">⏱ SISA WAKTU WINDOW</div>
      <div class="tval ${tCls}" id="tv">${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}</div>
    </div>
    <div class="track"><div class="fill" id="pf" style="width:${prog}%"></div></div>
  </div>

  <div class="sig-card ${sc} fade-in">
    <div class="badge ${bc}">SINYAL • ${bl}</div>
    <div class="sigdir ${sdc}">${sd}</div>
    <div class="sigsub">${analysis?(analysis.conf>=MIN_CONF?'Kekuatan cukup — eksekusi manual di Polymarket':`Sinyal lemah (${conf.toFixed(0)}% < ${MIN_CONF}%) — TUNGGU`):'Mengumpulkan data...'}</div>
    <div class="crow">
      <div class="clabel">Kekuatan Sinyal</div>
      <div class="cpct" style="color:var(--${cc})">${conf.toFixed(0)}%</div>
    </div>
    <div class="ctrack"><div class="cfill ${cc}" style="width:${conf}%"></div></div>
  </div>

  <div class="card fade-in">
    <div class="sec-title">💱 Harga Token Polymarket</div>
    <div class="pgrid">
      <div class="pbox upb">
        <div class="pblabel up">⬆ UP</div>
        <div class="pbval">${upP?'$'+upP.toFixed(3):'-'}</div>
        <div class="pbprob">${upP?(upP*100).toFixed(1)+'% prob':'---'}</div>
      </div>
      <div class="pbox dnb">
        <div class="pblabel dn">⬇ DOWN</div>
        <div class="pbval">${downP?'$'+downP.toFixed(3):'-'}</div>
        <div class="pbprob">${downP?(downP*100).toFixed(1)+'% prob':'---'}</div>
      </div>
    </div>
    ${payH}
  </div>

  <div class="card fade-in">
    <div class="sec-title">📊 Indikator</div>
    <div class="igrid">
      <div class="iitem">
        <div class="iname">RSI 14</div>
        <div class="ival ${r>70?'bear':r<30?'bull':r>55?'bull':'bear'}">${r.toFixed(1)}</div>
        <div class="idesc">${r>70?'Overbought':r<30?'Oversold':r>55?'Bullish':'Bearish'}</div>
      </div>
      <div class="iitem">
        <div class="iname">EMA 5/13</div>
        <div class="ival ${emab?'bull':'bear'}">${emab?'📈 Bullish':'📉 Bearish'}</div>
        <div class="idesc">Tren jangka pendek</div>
      </div>
      <div class="iitem">
        <div class="iname">Vs Open</div>
        <div class="ival ${up?'bull':'bear'}">${diffPct>=0?'+':''}${diffPct.toFixed(3)}%</div>
        <div class="idesc">Posisi vs open window</div>
      </div>
      <div class="iitem">
        <div class="iname">Skor</div>
        <div class="ival ${analysis&&analysis.score>0?'bull':analysis&&analysis.score<0?'bear':'neut'}">${analysis?analysis.score.toFixed(0):'0'}</div>
        <div class="idesc">-100 bear / +100 bull</div>
      </div>
    </div>
  </div>

  <a class="lcard fade-in" href="https://polymarket.com/${slug?'market/'+slug:'crypto/5M'}" target="_blank">
    <div class="ltext"><small>BUKA DI POLYMARKET →</small>${slug?slug.substring(0,30)+'...':'polymarket.com/crypto/5M'}</div>
    <span style="font-size:20px;color:var(--blue)">↗</span>
  </a>

  <button class="rbtn" id="rbtn" onclick="manualRefresh()">🔄 REFRESH MANUAL</button>
  <div class="lupdate">Update: ${tStr} • Auto tiap 5 menit</div>
  `;
}

async function manualRefresh(){
  const b=document.getElementById('rbtn');
  if(b){b.disabled=true;b.textContent='⏳ Mengambil data...'}
  S.error=null;
  await fetchAll();
}

// ── INIT ──
fetchAll();
startTimer();
setInterval(fetchAll,5*60*1000);
</script>
</body>
</html>
