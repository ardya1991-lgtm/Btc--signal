<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>BTC 5m Up/Down Predictor</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
            background:var(--bg);
            color:var(--text);
            padding:16px;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .header {
            display:flex;
            align-items:center;
            gap:12px;
            background:var(--card);
            padding:16px;
            border-radius:16px;
            border:1px solid var(--border);
        }
        .logo {
            width:48px;
            height:48px;
            border-radius:12px;
            background:linear-gradient(135deg, #f7931a, #ff6b35);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
        }
        .price-block {
            background:var(--card);
            border-radius:16px;
            padding:16px;
            border:1px solid var(--border);
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:16px;
        }
        .price {
            font-size:2rem;
            font-weight:800;
            font-family:'JetBrains Mono',monospace;
        }
        .change {
            font-size:0.9rem;
            font-weight:600;
            padding:4px 12px;
            border-radius:8px;
        }
        .up { background:rgba(16,185,129,0.2); color:var(--green); }
        .down { background:rgba(239,68,68,0.2); color:var(--red); }
        .prediction-box {
            background:var(--card);
            border-radius:16px;
            padding:24px;
            text-align:center;
            border:2px solid var(--border);
        }
        .prediction-title { font-size:0.85rem; color:var(--text2); margin-bottom:8px; }
        .prediction-value {
            font-size:2.8rem;
            font-weight:900;
            letter-spacing:-0.02em;
        }
        .prob-row {
            display:flex;
            justify-content:center;
            gap:24px;
            margin-top:12px;
            font-size:1.2rem;
            font-weight:600;
        }
        .prob-up { color:var(--green); }
        .prob-down { color:var(--red); }
        .conf-bar {
            height:10px;
            border-radius:5px;
            background:#334155;
            margin-top:12px;
            overflow:hidden;
            display:flex;
        }
        .fill-up { height:100%; background:var(--green); }
        .fill-down { height:100%; background:var(--red); }
        .mini-chart {
            width:100%;
            height:200px;
            background:var(--card);
            border-radius:12px;
            border:1px solid var(--border);
            display:block;
        }
        .grid {
            display:grid;
            grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
            gap:12px;
        }
        .ind-card {
            background:var(--card);
            padding:14px;
            border-radius:12px;
            border:1px solid var(--border);
            text-align:center;
        }
        .ind-name { font-size:0.7rem; color:var(--text2); text-transform:uppercase; }
        .ind-val { font-size:1.3rem; font-weight:700; font-family:'JetBrains Mono',monospace; }
        .badge {
            display:inline-block;
            font-size:0.7rem;
            font-weight:600;
            padding:2px 8px;
            border-radius:6px;
            margin-top:4px;
        }
        .badge.bull { background:rgba(16,185,129,0.2); color:var(--green); }
        .badge.bear { background:rgba(239,68,68,0.2); color:var(--red); }
        .badge.neutral { background:rgba(245,158,11,0.2); color:var(--gold); }
        .log-container {
            max-height:200px;
            overflow-y:auto;
            background:var(--card);
            border-radius:12px;
            padding:12px;
            border:1px solid var(--border);
            font-size:0.75rem;
            font-family:'JetBrains Mono',monospace;
        }
        .log-item { padding:6px 0; border-bottom:1px solid var(--border); }
        .btn {
            padding:8px 16px;
            border-radius:8px;
            border:1px solid var(--border);
            background:var(--card);
            color:var(--text);
            font-size:0.8rem;
            cursor:pointer;
        }
    </style>
</head>
<body>

<div class="header">
    <div class="logo">₿</div>
    <div><h1 style="font-size:1.2rem;">BTC 5m Up/Down</h1><span style="font-size:0.7rem;color:var(--text2);">Real‑time dari WebSocket</span></div>
    <button class="btn" onclick="toggleAudio()" style="margin-left:auto;">🔔 <span id="audioStatus">Off</span></button>
</div>

<div class="price-block">
    <div>
        <div style="font-size:0.7rem;color:var(--text2);">BTC/USDT</div>
        <div class="price" id="priceDisplay">--</div>
    </div>
    <div class="change" id="changeDisplay">--</div>
    <div style="margin-left:auto;font-size:0.75rem;color:var(--text2);" id="updateTime">--</div>
</div>

<canvas class="mini-chart" id="miniChart" width="400" height="200"></canvas>

<div class="prediction-box" id="predictionBox">
    <div class="prediction-title">⏳ Prediksi 5 Menit ke Depan</div>
    <div class="prediction-value" id="predictionText">Mengumpulkan candle...</div>
    <div class="prob-row">
        <span class="prob-up" id="probUp">UP: --%</span>
        <span class="prob-down" id="probDown">DOWN: --%</span>
    </div>
    <div class="conf-bar">
        <div class="fill-up" id="fillUp" style="width:50%;"></div>
        <div class="fill-down" id="fillDown" style="width:50%;"></div>
    </div>
    <div style="font-size:0.7rem;color:var(--text2);margin-top:10px;" id="reasonText"></div>
</div>

<div class="grid" id="indicatorsGrid">
    <div class="ind-card"><div class="ind-name">RSI</div><div class="ind-val">--</div><span class="badge neutral">neutral</span></div>
    <div class="ind-card"><div class="ind-name">MACD Hist</div><div class="ind-val">--</div><span class="badge neutral">neutral</span></div>
    <div class="ind-card"><div class="ind-name">SMA 20</div><div class="ind-val">--</div><span class="badge neutral">neutral</span></div>
    <div class="ind-card"><div class="ind-name">SMA 50</div><div class="ind-val">--</div><span class="badge neutral">neutral</span></div>
    <div class="ind-card"><div class="ind-name">BB Upper</div><div class="ind-val">--</div><span class="badge neutral">neutral</span></div>
    <div class="ind-card"><div class="ind-name">BB Lower</div><div class="ind-val">--</div><span class="badge neutral">neutral</span></div>
</div>

<div style="font-size:0.8rem;color:var(--text2);">📋 Log Prediksi</div>
<div class="log-container" id="logContainer"><div style="color:var(--text2);">Menunggu sinyal...</div></div>

<script>
// ========== PWA ==========
if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([
        `self.addEventListener('fetch',e=>{e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)))})`
    ],{type:'application/javascript'})));
}

// ========== Audio & Notifikasi ==========
let audioOn = false;
function toggleAudio() {
    audioOn = !audioOn;
    document.getElementById('audioStatus').textContent = audioOn ? 'On' : 'Off';
    if (audioOn && Notification.permission !== 'granted') Notification.requestPermission();
}
function notify(signal) {
    if (!audioOn) return;
    if (navigator.vibrate) navigator.vibrate([200,100,200]);
    try {
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = signal.includes('UP') ? 800 : 400;
        gain.gain.value = 0.3;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
    if (Notification.permission === 'granted') {
        new Notification(`Prediksi 5m: ${signal}`, {
            body: `Probabilitas ${signal} pada ${new Date().toLocaleTimeString()}`,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" rx="6" fill="%23f7931a"/><text x="16" y="24" font-size="20" text-anchor="middle" fill="white">₿</text></svg>'
        });
    }
}

// ========== Candle Builder from WebSocket ==========
const candles = []; // array of {time, open, high, low, close, volume}
let currentCandle = null;
let currentPrice = null;
let lastSignal = '';
const log = [];

function addLog(entry) {
    log.unshift({ time: new Date().toLocaleTimeString(), ...entry });
    if (log.length > 50) log.pop();
    const c = document.getElementById('logContainer');
    c.innerHTML = log.map(e => `<div class="log-item"><span style="color:var(--gold)">${e.time}</span> <strong>${e.signal}</strong> (UP ${e.up}% / DOWN ${e.down}%)</div>`).join('') || '<div style="color:var(--text2);">Tidak ada sinyal</div>';
}

function getCurrent5mTimestamp() {
    const now = Math.floor(Date.now() / 1000);
    return now - (now % 300); // round down to 5 minutes
}

function updateCandle(price) {
    const ts = getCurrent5mTimestamp();
    if (!currentCandle || currentCandle.time !== ts) {
        if (currentCandle) {
            candles.push(currentCandle);
            if (candles.length > 200) candles.shift();
        }
        currentCandle = {
            time: ts,
            open: price,
            high: price,
            low: price,
            close: price,
            volume: 0
        };
    } else {
        if (price > currentCandle.high) currentCandle.high = price;
        if (price < currentCandle.low) currentCandle.low = price;
        currentCandle.close = price;
        currentCandle.volume += 1; // simplified volume counter
    }
}

// WebSocket connection
let ws;
function connectWS() {
    if (ws) ws.close();
    ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    ws.onmessage = (e) => {
        const t = JSON.parse(e.data);
        currentPrice = parseFloat(t.p);
        updateCandle(currentPrice);
        updateUI();
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
    ws.onerror = () => ws.close();
}

// ========== Technical Indicators ==========
function SMA(d,p) {
    let o=[];
    for(let i=0;i<d.length;i++) {
        if(i<p-1){ o.push(null); continue; }
        let s=0; for(let j=i-p+1;j<=i;j++) s+=d[j];
        o.push(s/p);
    }
    return o;
}
function EMA(d,p) {
    let o=[d[0]], k=2/(p+1);
    for(let i=1;i<d.length;i++) o.push(d[i]*k + o[i-1]*(1-k));
    return o;
}
function RSI(c,p=14) {
    if(c.length<p+1) return {v:null,s:'neutral'};
    let g=0,l=0;
    for(let i=1;i<=p;i++){ let d=c[i]-c[i-1]; if(d>0)g+=d; else l-=d; }
    let ag=g/p, al=l/p, r=al===0?100:100-(100/(1+ag/al));
    for(let i=p+1;i<c.length;i++){
        let d=c[i]-c[i-1];
        ag=(ag*(p-1)+(d>0?d:0))/p;
        al=(al*(p-1)+(d<0?-d:0))/p;
        r=al===0?100:100-(100/(1+ag/al));
    }
    return {v:r, s:r>70?'bearish':r<30?'bullish':'neutral'};
}
function MACD(c) {
    if(c.length<35) return {h:null,s:'neutral'};
    let e12=EMA(c,12), e26=EMA(c,26);
    let macd=e12.map((v,i)=>v-e26[i]);
    let sig=EMA(macd.slice(25),9);
    let padded=[...new Array(25).fill(null),...sig];
    let hist=macd.map((v,i)=>v-padded[i]);
    let last=hist[hist.length-1];
    return {h:last, s:last>0?'bullish':'bearish'};
}
function BB(c,p=20,mult=2) {
    let sma=SMA(c,p);
    let up=[], low=[];
    for(let i=p-1;i<c.length;i++){
        let slice=c.slice(i-p+1,i+1);
        let mean=sma[i];
        let vari=slice.reduce((s,v)=>s+Math.pow(v-mean,2),0)/p;
        let std=Math.sqrt(vari);
        up.push(mean+mult*std);
        low.push(mean-mult*std);
    }
    return {
        u: up[up.length-1]||null,
        l: low[low.length-1]||null,
        s: sma[sma.length-1]||null
    };
}

function predict() {
    if (candles.length < 60) return null;
    const closes = candles.map(c=>c.close);
    const vols = candles.map(c=>c.volume);
    const last = closes[closes.length-1];
    const prev = closes[closes.length-2];
    const rsi = RSI(closes);
    const macd = MACD(closes);
    const bb = BB(closes);
    const sma20 = SMA(closes,20);
    const sma50 = SMA(closes,50);
    const lastSma20 = sma20[sma20.length-1];
    const lastSma50 = sma50[sma50.length-1];

    const candleUp = last > prev;
    const v5 = vols.slice(-5).reduce((a,b)=>a+b,0)/5;
    const v10 = vols.slice(-10,-5).reduce((a,b)=>a+b,0)/5;
    const volSig = v5 > v10*1.2 ? 'up' : v5 < v10*0.8 ? 'down' : 'neutral';
    const posBB = last < bb.l ? 'up' : last > bb.u ? 'down' : 'neutral';
    let upHist = 0;
    for(let i=1;i<closes.length;i++) if(closes[i]>closes[i-1]) upHist++;
    const histUpPct = (upHist/(closes.length-1))*100;

    let up=0, down=0, total=0;
    const add = (w, dir) => {
        total+=w;
        if(dir==='up') up+=w;
        else if(dir==='down') down+=w;
        else { up+=w*0.5; down+=w*0.5; }
    };
    add(2, candleUp?'up':'down');
    add(1.5, rsi.s==='bullish'?'up':rsi.s==='bearish'?'down':'neutral');
    add(1.5, macd.s==='bullish'?'up':'down');
    add(1.2, lastSma20>lastSma50?'up':'down');
    add(1.0, posBB);
    add(0.8, volSig);
    add(1.0, histUpPct>55?'up':histUpPct<45?'down':'neutral');

    const upPct = Math.round((up/total)*100);
    const downPct = Math.round((down/total)*100);
    let signal = upPct>downPct?'UP ▲':'DOWN ▼';
    if(upPct>=65) signal='UP ▲▲';
    else if(downPct>=65) signal='DOWN ▼▼';
    if(upPct===downPct) signal='NETRAL ⬌';

    let reasons = [];
    if(rsi.v>70) reasons.push('RSI overbought');
    if(rsi.v<30) reasons.push('RSI oversold');
    if(macd.h>0) reasons.push('MACD bullish');
    else reasons.push('MACD bearish');
    if(candleUp) reasons.push('Candle naik');
    else reasons.push('Candle turun');
    if(volSig==='up') reasons.push('Volume naik');
    if(reasons.length===0) reasons.push('Campuran sinyal');

    return {
        signal, upPct, downPct,
        rsi: rsi.v?.toFixed(2),
        macd: macd.h?.toFixed(2),
        bbUp: bb.u?.toFixed(2),
        bbLow: bb.l?.toFixed(2),
        sma20: lastSma20?.toFixed(2),
        sma50: lastSma50?.toFixed(2),
        reasons: reasons.join(', ')
    };
}

// ========== UI Update ==========
function updateUI() {
    if (!currentPrice) {
        document.getElementById('priceDisplay').textContent = '--';
        return;
    }

    // Price
    document.getElementById('priceDisplay').textContent = '$' + currentPrice.toLocaleString('en-US',{minimumFractionDigits:2});
    if (candles.length >= 1) {
        const lastCandle = candles[candles.length-1];
        const prevCandle = candles.length>1 ? candles[candles.length-2] : null;
        if (prevCandle) {
            const chg = lastCandle.close - prevCandle.close;
            const pct = (chg/prevCandle.close)*100;
            document.getElementById('changeDisplay').textContent = (chg>=0?'▲':'▼')+' '+Math.abs(pct).toFixed(2)+'%';
            document.getElementById('changeDisplay').className = 'change '+(chg>=0?'up':'down');
        }
    }
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();

    // Prediction
    if (candles.length < 60) {
        document.getElementById('predictionText').textContent = 'Mengumpulkan candle... ('+candles.length+'/60)';
        document.getElementById('probUp').textContent = 'UP: --%';
        document.getElementById('probDown').textContent = 'DOWN: --%';
        document.getElementById('fillUp').style.width = '50%';
        document.getElementById('fillDown').style.width = '50%';
        document.getElementById('reasonText').textContent = 'Butuh minimal 60 candle 5m';
        return;
    }

    const pred = predict();
    if (!pred) return;

    const prevSignal = document.getElementById('predictionText').textContent;
    document.getElementById('predictionText').textContent = pred.signal;
    document.getElementById('predictionText').style.color = pred.signal.includes('UP')?'var(--green)':pred.signal.includes('DOWN')?'var(--red)':'var(--gold)';
    document.getElementById('probUp').textContent = 'UP: '+pred.upPct+'%';
    document.getElementById('probDown').textContent = 'DOWN: '+pred.downPct+'%';
    document.getElementById('fillUp').style.width = pred.upPct+'%';
    document.getElementById('fillDown').style.width = pred.downPct+'%';
    document.getElementById('reasonText').textContent = pred.reasons;

    if (prevSignal !== pred.signal && !pred.signal.includes('NETRAL')) {
        addLog({ signal: pred.signal, up: pred.upPct, down: pred.downPct });
        notify(pred.signal);
    }

    // Indicators grid
    const items = [
        { n:'RSI', v:pred.rsi, s:parseFloat(pred.rsi)>70?'bearish':parseFloat(pred.rsi)<30?'bullish':'neutral' },
        { n:'MACD Hist', v:pred.macd, s:parseFloat(pred.macd)>0?'bullish':'bearish' },
        { n:'SMA 20', v:pred.sma20, s:'neutral' },
        { n:'SMA 50', v:pred.sma50, s:'neutral' },
        { n:'BB Upper', v:pred.bbUp, s:'neutral' },
        { n:'BB Lower', v:pred.bbLow, s:'neutral' }
    ];
    const grid = document.getElementById('indicatorsGrid');
    grid.innerHTML = items.map(i=>`
        <div class="ind-card">
            <div class="ind-name">${i.n}</div>
            <div class="ind-val">${i.v||'--'}</div>
            <span class="badge ${i.s==='bullish'?'bull':i.s==='bearish'?'bear':'neutral'}">${i.s}</span>
        </div>
    `).join('');

    drawChart();
}

// ========== Mini Chart ==========
function drawChart() {
    const canvas = document.getElementById('miniChart');
    if(!canvas || candles.length<5) return;
    const ctx = canvas.getContext('2d');
    const w=canvas.width, h=canvas.height;
    const closes = candles.slice(-50).map(c=>c.close);
    const min = Math.min(...closes)*0.999;
    const max = Math.max(...closes)*1.001;
    const range = max-min;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle='#334155';
    ctx.lineWidth=0.5;
    for(let i=0;i<5;i++) {
        let y=20+(h-40)*(i/4);
        ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(w-10,y); ctx.stroke();
    }
    ctx.beginPath();
    ctx.strokeStyle='#f7931a';
    ctx.lineWidth=2;
    for(let i=0;i<closes.length;i++) {
        let x=30+(w-40)*(i/(closes.length-1));
        let y=20+(h-40)*(1-(closes[i]-min)/range);
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.stroke();
    let lx=30+(w-40);
    let ly=20+(h-40)*(1-(closes[closes.length-1]-min)/range);
    ctx.fillStyle='#f7931a';
    ctx.beginPath(); ctx.arc(lx,ly,4,0,2*Math.PI); ctx.fill();
    ctx.fillStyle='#94a3b8';
    ctx.font='10px JetBrains Mono';
    ctx.fillText('$'+max.toFixed(0),32,16);
    ctx.fillText('$'+min.toFixed(0),32,h-5);
}

// ========== Start ==========
connectWS();
// Update UI setiap detik agar tetap responsif
setInterval(updateUI, 1000);
</script>
</body>
</html>
