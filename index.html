<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BTC 5m Up/Down">
    <title>BTC 5m Up/Down Predictor</title>
    <link rel="manifest" href="data:application/json;base64,${MANIFEST_JSON_BASE64}">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background:var(--bg);
            color:var(--text);
            padding:16px;
            min-height:100vh;
            display:flex;
            flex-direction:column;
            gap:16px;
        }
        .header {
            display:flex;
            align-items:center;
            gap:12px;
            background:var(--card-bg);
            padding:16px;
            border-radius:16px;
            border:1px solid var(--border);
        }
        .logo {
            width:48px;
            height:48px;
            border-radius:12px;
            background:linear-gradient(135deg, #f7931a, #ff6b35);
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:28px;
            font-weight:bold;
        }
        .price-block {
            background:var(--card-bg);
            border-radius:16px;
            padding:16px;
            border:1px solid var(--border);
            display:flex;
            flex-wrap:wrap;
            align-items:center;
            gap:16px;
        }
        .price {
            font-size:2rem;
            font-weight:800;
            font-family:'JetBrains Mono', monospace;
        }
        .change {
            font-size:0.9rem;
            font-weight:600;
            padding:4px 12px;
            border-radius:8px;
        }
        .up { background:rgba(16,185,129,0.2); color:var(--green); }
        .down { background:rgba(239,68,68,0.2); color:var(--red); }
        .prediction-box {
            background:var(--card-bg);
            border-radius:16px;
            padding:24px;
            text-align:center;
            border:2px solid var(--border);
        }
        .prediction-title { font-size:0.85rem; color:var(--text2); margin-bottom:8px; }
        .prediction-value {
            font-size:2.8rem;
            font-weight:900;
            letter-spacing:-0.02em;
        }
        .probabilities {
            display:flex;
            justify-content:center;
            gap:24px;
            margin-top:12px;
            font-size:1.1rem;
            font-weight:600;
        }
        .prob-up { color:var(--green); }
        .prob-down { color:var(--red); }
        .conf-bar {
            height:10px;
            border-radius:5px;
            background:#334155;
            margin-top:12px;
            overflow:hidden;
            display:flex;
        }
        .conf-fill-up {
            height:100%;
            background:var(--green);
            transition:width 0.3s;
        }
        .conf-fill-down {
            height:100%;
            background:var(--red);
            transition:width 0.3s;
        }
        .mini-chart {
            width:100%;
            height:200px;
            background:var(--card-bg);
            border-radius:12px;
            border:1px solid var(--border);
            display:block;
        }
        .grid {
            display:grid;
            grid-template-columns:repeat(auto-fit, minmax(140px, 1fr));
            gap:12px;
        }
        .ind-card {
            background:var(--card-bg);
            padding:14px;
            border-radius:12px;
            border:1px solid var(--border);
            text-align:center;
        }
        .ind-name { font-size:0.7rem; color:var(--text2); text-transform:uppercase; }
        .ind-val { font-size:1.3rem; font-weight:700; font-family:'JetBrains Mono', monospace; }
        .badge {
            display:inline-block;
            font-size:0.7rem;
            font-weight:600;
            padding:2px 8px;
            border-radius:6px;
            margin-top:4px;
        }
        .badge.bull { background:rgba(16,185,129,0.2); color:var(--green); }
        .badge.bear { background:rgba(239,68,68,0.2); color:var(--red); }
        .badge.neutral { background:rgba(245,158,11,0.2); color:var(--gold); }
        .log-container {
            max-height:200px;
            overflow-y:auto;
            background:var(--card-bg);
            border-radius:12px;
            padding:12px;
            border:1px solid var(--border);
            font-size:0.75rem;
            font-family:'JetBrains Mono', monospace;
        }
        .log-item { padding:6px 0; border-bottom:1px solid var(--border); }
        .modal {
            position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.85); display:flex; align-items:center; justify-content:center; z-index:999;
        }
        .modal-content {
            background:var(--card-bg); padding:24px; border-radius:16px; max-width:320px; text-align:center; border:1px solid var(--border);
        }
        button {
            padding:10px 20px; border-radius:8px; border:none; font-weight:bold; margin-top:12px; background:var(--green); color:#000;
        }
        .toggle-btn {
            padding:6px 12px; border-radius:6px; border:1px solid var(--border); background:var(--card-bg); color:var(--text); font-size:0.7rem;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="logo">₿</div>
    <div><h1 style="font-size:1.2rem;">BTC 5m Up/Down</h1><span style="font-size:0.7rem;color:var(--text2);">Prediksi 5 menit ke depan</span></div>
    <button class="toggle-btn" onclick="toggleAudio()" style="margin-left:auto;">🔔 <span id="audioStatus">Off</span></button>
</div>

<!-- Price -->
<div class="price-block">
    <div>
        <div style="font-size:0.7rem;color:var(--text2);">BTC/USDT</div>
        <div class="price" id="priceDisplay">--</div>
    </div>
    <div class="change" id="changeDisplay">--</div>
    <div style="margin-left:auto;font-size:0.75rem;color:var(--text2);" id="updateTime">--</div>
</div>

<!-- Mini Chart -->
<canvas class="mini-chart" id="miniChart" width="400" height="200"></canvas>

<!-- Prediction Box -->
<div class="prediction-box" id="predictionBox">
    <div class="prediction-title">⏳ Prediksi 5 Menit ke Depan</div>
    <div class="prediction-value" id="predictionText">--</div>
    <div class="probabilities">
        <span class="prob-up" id="probUp">UP: --%</span>
        <span class="prob-down" id="probDown">DOWN: --%</span>
    </div>
    <div class="conf-bar">
        <div class="conf-fill-up" id="confFillUp" style="width:50%;"></div>
        <div class="conf-fill-down" id="confFillDown" style="width:50%;"></div>
    </div>
    <div style="font-size:0.7rem;color:var(--text2);margin-top:10px;" id="reasonText"></div>
</div>

<!-- Indikator -->
<div class="grid" id="indicatorsGrid"></div>

<!-- Log Sinyal -->
<div style="font-size:0.8rem;color:var(--text2);">📋 Log Prediksi 5m</div>
<div class="log-container" id="logContainer">
    <div style="color:var(--text2);">Menunggu sinyal...</div>
</div>

<!-- Modal -->
<div class="modal" id="disclaimerModal">
    <div class="modal-content">
        <h3 style="color:var(--gold);">⚠️ Peringatan Risiko</h3>
        <p style="font-size:0.8rem;margin:12px 0;">Prediksi ini hanya alat bantu analisis. <strong>BUKAN jaminan profit.</strong><br>Trading crypto sangat berisiko.</p>
        <button onclick="closeDisclaimer()">Saya Mengerti</button>
    </div>
</div>

<script>
// ========== PWA & Service Worker ==========
if ('serviceWorker' in navigator) {
    const swCode = `const CACHE_NAME='btc-5m-pred-v1';self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{if(r.ok){let a=r.clone();caches.open(CACHE_NAME).then(c=>c.put(e.request,a))}return r}).catch(()=>c)))});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'})));
}

// ========== Notifikasi & Audio ==========
let audioEnabled = false;
function toggleAudio() {
    audioEnabled = !audioEnabled;
    document.getElementById('audioStatus').textContent = audioEnabled ? 'On' : 'Off';
    if (audioEnabled && Notification.permission !== 'granted') {
        Notification.requestPermission();
    }
}

function notify(signal) {
    if (!audioEnabled) return;
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = signal.includes('UP') ? 800 : 400;
        gain.gain.value = 0.3;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
    if (Notification.permission === 'granted') {
        new Notification(`Prediksi 5m: ${signal}`, {
            body: `Probabilitas ${signal} pada ${new Date().toLocaleTimeString()}`,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" rx="6" fill="%23f7931a"/><text x="16" y="24" font-size="20" text-anchor="middle" fill="white">₿</text></svg>'
        });
    }
}

// ========== Data Handling ==========
let candles = [];
let currentPrice = null;
let lastPrediction = '';
const signalLog = [];

function addLog(entry) {
    signalLog.unshift({ time: new Date().toLocaleTimeString(), ...entry });
    if (signalLog.length > 50) signalLog.pop();
    renderLog();
}

function renderLog() {
    const container = document.getElementById('logContainer');
    container.innerHTML = signalLog.map(e => 
        `<div class="log-item"><span style="color:var(--gold)">${e.time}</span> <strong style="color:${e.signal.includes('UP')?'var(--green)':'var(--red)'}">${e.signal}</strong> (UP ${e.upProb}% / DOWN ${e.downProb}%)</div>`
    ).join('') || '<div style="color:var(--text2);">Tidak ada sinyal</div>';
}

// ========== Fetch & WebSocket ==========
async function fetchKlines(limit = 200) {
    try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=${limit}`);
        const data = await res.json();
        candles = data.map(k => ({
            time: k[0],
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4]),
            volume: parseFloat(k[5])
        }));
        currentPrice = candles[candles.length-1].close;
        return candles;
    } catch(e) { return null; }
}

let ws = null;
function connectWS() {
    if(ws) ws.close();
    ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@kline_5m');
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.k && msg.k.x) { // candle 5m closed
            // Update terbaru, ambil candle penuh
            fetchKlines(200).then(() => updateUI());
        }
        // update real-time price dari trade
    };
    // juga stream trade untuk harga real-time
    const wsTrade = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    wsTrade.onmessage = (ev) => {
        const t = JSON.parse(ev.data);
        if(t.p) { currentPrice = parseFloat(t.p); updateUI(); }
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
    wsTrade.onclose = () => {}; // wsTrade reconnect handled?
}

// ========== Technical Indicators ==========
function SMA(data, p) {
    let out = new Array(data.length).fill(null);
    for(let i=p-1;i<data.length;i++) {
        let sum=0; for(let j=i-p+1;j<=i;j++) sum+=data[j];
        out[i]=sum/p;
    }
    return out;
}
function EMA(data, p) {
    let out = [data[0]];
    let k = 2/(p+1);
    for(let i=1;i<data.length;i++) out.push(data[i]*k + out[i-1]*(1-k));
    return out;
}
function RSI(closes, p=14) {
    if(closes.length<p+1) return {val:null,sig:'neutral'};
    let gains=0, losses=0;
    for(let i=1;i<=p;i++) {
        let diff=closes[i]-closes[i-1];
        if(diff>0) gains+=diff; else losses-=diff;
    }
    let avgGain=gains/p, avgLoss=losses/p;
    let rsiVal = avgLoss===0?100:100-(100/(1+avgGain/avgLoss));
    for(let i=p+1;i<closes.length;i++) {
        let diff=closes[i]-closes[i-1];
        avgGain = (avgGain*(p-1)+(diff>0?diff:0))/p;
        avgLoss = (avgLoss*(p-1)+(diff<0?-diff:0))/p;
        rsiVal = avgLoss===0?100:100-(100/(1+avgGain/avgLoss));
    }
    let sig = rsiVal>70?'bearish':rsiVal<30?'bullish':'neutral';
    return {val:rsiVal,sig};
}
function MACD(closes) {
    if(closes.length<35) return {hist:null,sig:'neutral'};
    let ema12=EMA(closes,12), ema26=EMA(closes,26);
    let macdLine = ema12.map((v,i)=>v-ema26[i]);
    let signalLine = EMA(macdLine.slice(25),9);
    let padded = new Array(25).fill(null).concat(signalLine);
    let hist = macdLine.map((v,i)=>v-padded[i]);
    let lastHist = hist[hist.length-1];
    return {hist:lastHist, sig:lastHist>0?'bullish':'bearish'};
}
function Bollinger(closes, p=20, mult=2) {
    let sma = SMA(closes,p);
    let upper=[], lower=[];
    for(let i=p-1;i<closes.length;i++) {
        let slice=closes.slice(i-p+1,i+1);
        let mean=sma[i];
        let variance=slice.reduce((s,v)=>s+Math.pow(v-mean,2),0)/p;
        let std=Math.sqrt(variance);
        upper.push(mean+mult*std);
        lower.push(mean-mult*std);
    }
    return {
        upper: upper[upper.length-1] || null,
        lower: lower[lower.length-1] || null,
        sma: sma[sma.length-1] || null
    };
}

// ========== 5-MINUTE DIRECTION PREDICTION ==========
function predict5min() {
    if(candles.length<60) return null;
    const closes = candles.map(c=>c.close);
    const volumes = candles.map(c=>c.volume);
    const lastIdx = closes.length-1;
    const current = closes[lastIdx];
    const prev = closes[lastIdx-1];

    // 1. Hitung fitur-fitur candle terakhir
    const rsi = RSI(closes);
    const macd = MACD(closes);
    const bb = Bollinger(closes);
    
    // 2. Momentum 5 menit terakhir (candle terbaru vs sebelumnya)
    const candleChange = current - prev;
    const candleChangePct = (candleChange/prev)*100;
    
    // 3. Volume momentum (5 candle terakhir vs 5 sebelumnya)
    const vol5 = volumes.slice(-5).reduce((a,b)=>a+b,0)/5;
    const vol10 = volumes.slice(-10,-5).reduce((a,b)=>a+b,0)/5;
    const volSignal = vol5 > vol10*1.2 ? 'bullish' : vol5 < vol10*0.8 ? 'bearish' : 'neutral';
    
    // 4. Trend SMA 20 vs SMA 50
    const sma20 = SMA(closes,20);
    const sma50 = SMA(closes,50);
    const trendUp = sma20[lastIdx] > sma50[lastIdx];
    
    // 5. Pola harga vs Bollinger
    const priceVsBB = current < bb.lower ? 'bullish' : current > bb.upper ? 'bearish' : 'neutral';
    
    // 6. Statistik historis: berapa % candle 5m sebelumnya yang naik?
    let upCount = 0;
    for(let i=1;i<closes.length;i++) {
        if(closes[i] > closes[i-1]) upCount++;
    }
    const historicalUpProb = (upCount / (closes.length-1)) * 100;
    
    // ==== SYSTEM SCORING untuk probabilitas UP 5 menit ke depan ====
    let upScore = 0, downScore = 0, total = 0;
    const add = (condition, weight, direction) => {
        total += weight;
        if(direction === 'up') upScore += weight;
        else if(direction === 'down') downScore += weight;
        else { upScore += weight*0.5; downScore += weight*0.5; }
    };
    
    // Momentum candle terakhir
    add(true, 2, candleChange > 0 ? 'up' : 'down');
    // RSI
    add(true, 1.5, rsi.val < 30 ? 'up' : rsi.val > 70 ? 'down' : 'neutral');
    // MACD
    add(true, 1.5, macd.hist > 0 ? 'up' : 'down');
    // Trend SMA
    add(true, 1.2, trendUp ? 'up' : 'down');
    // Bollinger
    add(true, 1.0, priceVsBB);
    // Volume momentum
    add(true, 0.8, volSignal);
    // Historical bias
    add(true, 1.0, historicalUpProb > 55 ? 'up' : historicalUpProb < 45 ? 'down' : 'neutral');
    
    const upProb = Math.round((upScore / total) * 100);
    const downProb = Math.round((downScore / total) * 100);
    
    let signal = upProb > downProb ? 'UP ▲' : downProb > upProb ? 'DOWN ▼' : 'NETRAL ⬌';
    if(upProb >= 65) signal = 'UP ▲▲';
    else if(downProb >= 65) signal = 'DOWN ▼▼';
    
    // Alasan
    let reasons = [];
    if(rsi.val && rsi.val>70) reasons.push('RSI overbought');
    if(rsi.val && rsi.val<30) reasons.push('RSI oversold');
    if(macd.hist>0) reasons.push('MACD naik');
    else reasons.push('MACD turun');
    if(candleChange>0) reasons.push('Candle bullish');
    else reasons.push('Candle bearish');
    if(volSignal==='bullish') reasons.push('Volume meningkat');
    
    return {
        signal, upProb, downProb,
        rsi: rsi.val?.toFixed(2),
        macdHist: macd.hist?.toFixed(2),
        bbUpper: bb.upper?.toFixed(2),
        bbLower: bb.lower?.toFixed(2),
        sma20: sma20[lastIdx]?.toFixed(2),
        sma50: sma50[lastIdx]?.toFixed(2),
        reasons: reasons.join(', ') || 'Analisis teknikal campuran'
    };
}

// ========== Mini Chart ==========
function drawMiniChart() {
    const canvas = document.getElementById('miniChart');
    if(!canvas || candles.length<5) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const closes = candles.slice(-50).map(c=>c.close);
    const min = Math.min(...closes)*0.999;
    const max = Math.max(...closes)*1.001;
    const range = max-min;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 0.5;
    for(let i=0;i<5;i++) {
        let y = 20 + (h-40)*(i/4);
        ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(w-10,y); ctx.stroke();
    }
    ctx.beginPath();
    ctx.strokeStyle = '#f7931a';
    ctx.lineWidth = 2;
    for(let i=0;i<closes.length;i++) {
        let x = 30 + (w-40)*(i/(closes.length-1));
        let y = 20 + (h-40)*(1-(closes[i]-min)/range);
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.stroke();
    let lastX = 30 + (w-40);
    let lastY = 20 + (h-40)*(1-(closes[closes.length-1]-min)/range);
    ctx.fillStyle = '#f7931a';
    ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, 2*Math.PI); ctx.fill();
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px JetBrains Mono';
    ctx.fillText('$'+max.toFixed(0), 32, 16);
    ctx.fillText('$'+min.toFixed(0), 32, h-5);
}

// ========== UI Update ==========
function updateUI() {
    if(!candles.length) return;
    const pred = predict5min();
    if(!pred) return;

    // Price
    document.getElementById('priceDisplay').textContent = '$' + (currentPrice || candles[candles.length-1].close).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const chg = document.getElementById('changeDisplay');
    const lastChange = candles[candles.length-1].close - candles[candles.length-2].close;
    chg.textContent = (lastChange>=0?'▲':'▼')+' '+Math.abs((lastChange/candles[candles.length-2].close)*100).toFixed(2)+'%';
    chg.className = 'change '+(lastChange>=0?'up':'down');
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();

    // Prediction
    const predText = document.getElementById('predictionText');
    const prevPred = predText.textContent;
    predText.textContent = pred.signal;
    predText.style.color = pred.signal.includes('UP')?'var(--green)':pred.signal.includes('DOWN')?'var(--red)':'var(--gold)';
    document.getElementById('probUp').textContent = 'UP: '+pred.upProb+'%';
    document.getElementById('probDown').textContent = 'DOWN: '+pred.downProb+'%';
    document.getElementById('confFillUp').style.width = pred.upProb+'%';
    document.getElementById('confFillDown').style.width = pred.downProb+'%';
    document.getElementById('reasonText').textContent = pred.reasons;

    // Log perubahan sinyal
    if (prevPred !== pred.signal && !pred.signal.includes('NETRAL')) {
        addLog({ signal: pred.signal, upProb: pred.upProb, downProb: pred.downProb });
        notify(pred.signal);
    }

    // Indikator grid
    const grid = document.getElementById('indicatorsGrid');
    const items = [
        { name:'RSI', val:pred.rsi, sig: parseFloat(pred.rsi)>70?'bearish':parseFloat(pred.rsi)<30?'bullish':'neutral' },
        { name:'MACD Hist', val:pred.macdHist, sig: parseFloat(pred.macdHist)>0?'bullish':'bearish' },
        { name:'SMA 20', val:pred.sma20, sig:'neutral' },
        { name:'SMA 50', val:pred.sma50, sig:'neutral' },
        { name:'BB Upper', val:pred.bbUpper, sig:'neutral' },
        { name:'BB Lower', val:pred.bbLower, sig:'neutral' }
    ];
    grid.innerHTML = items.map(i=>`
        <div class="ind-card">
            <div class="ind-name">${i.name}</div>
            <div class="ind-val">${i.val}</div>
            <span class="badge ${i.sig==='bullish'?'bull':i.sig==='bearish'?'bear':'neutral'}">${i.sig}</span>
        </div>
    `).join('');

    drawMiniChart();
}

// ========== Init ==========
function closeDisclaimer() {
    document.getElementById('disclaimerModal').style.display='none';
    localStorage.setItem('btc5mDisclaimer','1');
}

window.onload = () => {
    if (!localStorage.getItem('btc5mDisclaimer')) {
        document.getElementById('disclaimerModal').style.display = 'flex';
    }
    fetchKlines().then(() => {
        updateUI();
        connectWS();
    });
    setInterval(async () => {
        await fetchKlines();
        updateUI();
    }, 30000);
};
</script>
