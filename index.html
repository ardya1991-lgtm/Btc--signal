<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="BTC Signal">
    <title>BTC 5m Sinyal Trading</title>
    <link rel="manifest" href="data:application/json;base64,${MANIFEST_JSON_BASE64}">
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: #1e293b;
            --green: #10b981;
            --red: #ef4444;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --border: #334155;
            --gold: #f59e0b;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 16px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
        }
        .logo {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, #f7931a, #ff6b35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            font-weight: bold;
        }
        .price-block {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
        }
        .price {
            font-size: 2rem;
            font-weight: 800;
            font-family: 'JetBrains Mono', monospace;
        }
        .change {
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 12px;
            border-radius: 8px;
        }
        .up { background: rgba(16,185,129,0.2); color: var(--green); }
        .down { background: rgba(239,68,68,0.2); color: var(--red); }
        .signal-box {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 24px;
            text-align: center;
            border: 2px solid var(--border);
        }
        .signal-title { font-size: 0.85rem; color: var(--text2); margin-bottom: 8px; }
        .signal-value {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -0.02em;
        }
        .conf-bar {
            height: 10px;
            border-radius: 5px;
            background: #334155;
            margin-top: 12px;
            overflow: hidden;
        }
        .conf-fill {
            height: 100%;
            border-radius: 5px;
            transition: width 0.3s;
        }
        .mini-chart {
            width: 100%;
            height: 200px;
            background: var(--card-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            display: block;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 12px;
        }
        .ind-card {
            background: var(--card-bg);
            padding: 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .ind-name { font-size: 0.7rem; color: var(--text2); text-transform: uppercase; }
        .ind-val { font-size: 1.3rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .badge {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            padding: 2px 8px;
            border-radius: 6px;
            margin-top: 4px;
        }
        .badge.bull { background: rgba(16,185,129,0.2); color: var(--green); }
        .badge.bear { background: rgba(239,68,68,0.2); color: var(--red); }
        .badge.neutral { background: rgba(245,158,11,0.2); color: var(--gold); }
        .log-container {
            max-height: 200px;
            overflow-y: auto;
            background: var(--card-bg);
            border-radius: 12px;
            padding: 12px;
            border: 1px solid var(--border);
            font-size: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
        }
        .log-item { padding: 6px 0; border-bottom: 1px solid var(--border); }
        .modal {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.85); display: flex; align-items: center; justify-content: center; z-index: 999;
        }
        .modal-content {
            background: var(--card-bg); padding: 24px; border-radius: 16px; max-width: 320px; text-align: center; border: 1px solid var(--border);
        }
        button {
            padding: 10px 20px; border-radius: 8px; border: none; font-weight: bold; margin-top: 12px; background: var(--green); color: #000;
        }
        .toggle-btn {
            padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text); font-size: 0.7rem;
        }
    </style>
</head>
<body>

<!-- Header -->
<div class="header">
    <div class="logo">₿</div>
    <div><h1 style="font-size:1.2rem;">BTC 5m Trading Signal</h1><span style="font-size:0.7rem;color:var(--text2);">Real‑time analysis</span></div>
    <button class="toggle-btn" onclick="toggleAudio()" style="margin-left:auto;">🔔 <span id="audioStatus">Off</span></button>
</div>

<!-- Price -->
<div class="price-block">
    <div>
        <div style="font-size:0.7rem;color:var(--text2);">BTC/USDT</div>
        <div class="price" id="priceDisplay">--</div>
    </div>
    <div class="change" id="changeDisplay">--</div>
    <div style="margin-left:auto;font-size:0.75rem;color:var(--text2);" id="updateTime">--</div>
</div>

<!-- Mini Chart -->
<canvas class="mini-chart" id="miniChart" width="400" height="200"></canvas>

<!-- Trading Signal -->
<div class="signal-box" id="signalBox">
    <div class="signal-title">🎯 SINYAL TRADING</div>
    <div class="signal-value" id="signalText">--</div>
    <div style="font-size:0.8rem;color:var(--text2);margin-top:6px;">Keyakinan: <span id="confidenceText">--</span>%</div>
    <div class="conf-bar"><div class="conf-fill" id="confFill" style="width:0%"></div></div>
    <div style="font-size:0.7rem;color:var(--text2);margin-top:10px;" id="reasonText"></div>
</div>

<!-- Indikator Teknikal -->
<div class="grid" id="indicatorsGrid"></div>

<!-- Log Sinyal -->
<div style="font-size:0.8rem;color:var(--text2);">📋 Log Sinyal Terbaru</div>
<div class="log-container" id="logContainer">
    <div style="color:var(--text2);">Menunggu sinyal...</div>
</div>

<!-- Modal Disclaimer -->
<div class="modal" id="disclaimerModal">
    <div class="modal-content">
        <h3 style="color:var(--gold);">⚠️ Peringatan Risiko</h3>
        <p style="font-size:0.8rem;margin:12px 0;">Bot ini hanya alat analisis teknikal. <strong>BUKAN jaminan profit.</strong><br>Trading crypto sangat berisiko. Gunakan dengan manajemen risiko ketat.</p>
        <button onclick="closeDisclaimer()">Saya Mengerti</button>
    </div>
</div>

<script>
// ========== PWA & Service Worker ==========
if ('serviceWorker' in navigator) {
    const swCode = `
        const CACHE_NAME = 'btc-signal-v1';
        self.addEventListener('fetch', e => {
            e.respondWith(
                caches.match(e.request).then(cached =>
                    cached || fetch(e.request).then(r => { 
                        if(r.ok && e.request.url.includes('api.binance.com')) {
                            const clone = r.clone();
                            caches.open(CACHE_NAME).then(c => c.put(e.request, clone));
                        }
                        return r;
                    }).catch(() => cached)
                )
            );
        });
    `;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([swCode],{type:'application/javascript'})));
}

// ========== Notifikasi & Audio ==========
let audioEnabled = false;
function toggleAudio() {
    audioEnabled = !audioEnabled;
    document.getElementById('audioStatus').textContent = audioEnabled ? 'On' : 'Off';
    // Request notification permission if not granted
    if (audioEnabled && Notification.permission !== 'granted') {
        Notification.requestPermission();
    }
}

function notifySignal(signal) {
    if (!audioEnabled) return;
    // Vibrate (Android)
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
    // Audio beep sederhana dengan Web Audio API
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.value = signal.includes('BUY') ? 800 : 400;
        gain.gain.value = 0.3;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.2);
    } catch(e) {}
    // Web Notification
    if (Notification.permission === 'granted') {
        new Notification(`Sinyal BTC 5m: ${signal}`, {
            body: `Sinyal ${signal} terdeteksi pada ${new Date().toLocaleTimeString()}`,
            icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" rx="6" fill="%23f7931a"/><text x="16" y="24" font-size="20" text-anchor="middle" fill="white">₿</text></svg>'
        });
    }
}

// ========== Data Handling ==========
let candles = [];
let currentPrice = null;
let lastSignal = '';
const signalLog = [];

function addLog(entry) {
    signalLog.unshift({ time: new Date().toLocaleTimeString(), ...entry });
    if (signalLog.length > 50) signalLog.pop();
    renderLog();
}

function renderLog() {
    const container = document.getElementById('logContainer');
    container.innerHTML = signalLog.map(e => 
        `<div class="log-item"><span style="color:var(--gold)">${e.time}</span> <strong style="color:${e.signal.includes('BUY')?'var(--green)':'var(--red)'}">${e.signal}</strong> (${e.confidence}%)</div>`
    ).join('') || '<div style="color:var(--text2);">Tidak ada sinyal</div>';
}

// Fetch klines
async function fetchKlines(limit = 200) {
    try {
        const res = await fetch(`https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=5m&limit=${limit}`);
        const data = await res.json();
        candles = data.map(k => ({
            time: k[0],
            open: parseFloat(k[1]),
            high: parseFloat(k[2]),
            low: parseFloat(k[3]),
            close: parseFloat(k[4]),
            volume: parseFloat(k[5])
        }));
        currentPrice = candles[candles.length-1].close;
        return candles;
    } catch(e) { return null; }
}

// WebSocket realtime
let ws = null;
function connectWS() {
    if(ws) ws.close();
    ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@trade');
    ws.onmessage = (e) => {
        const t = JSON.parse(e.data);
        if(t.p) { currentPrice = parseFloat(t.p); updateUI(); }
    };
    ws.onclose = () => setTimeout(connectWS, 3000);
}

// ========== Technical Indicators ==========
function SMA(data, p) {
    let out = new Array(data.length).fill(null);
    for(let i=p-1;i<data.length;i++) {
        let sum=0; for(let j=i-p+1;j<=i;j++) sum+=data[j];
        out[i]=sum/p;
    }
    return out;
}

function EMA(data, p) {
    let out = [data[0]];
    let k = 2/(p+1);
    for(let i=1;i<data.length;i++) out.push(data[i]*k + out[i-1]*(1-k));
    return out;
}

function RSI(closes, p=14) {
    if(closes.length<p+1) return {val:null,sig:'neutral'};
    let gains=0, losses=0;
    for(let i=1;i<=p;i++) {
        let diff=closes[i]-closes[i-1];
        if(diff>0) gains+=diff; else losses-=diff;
    }
    let avgGain=gains/p, avgLoss=losses/p;
    let rsiVal = avgLoss===0?100:100-(100/(1+avgGain/avgLoss));
    for(let i=p+1;i<closes.length;i++) {
        let diff=closes[i]-closes[i-1];
        avgGain = (avgGain*(p-1)+(diff>0?diff:0))/p;
        avgLoss = (avgLoss*(p-1)+(diff<0?-diff:0))/p;
        rsiVal = avgLoss===0?100:100-(100/(1+avgGain/avgLoss));
    }
    let sig = rsiVal>70?'bearish':rsiVal<30?'bullish':'neutral';
    return {val:rsiVal,sig};
}

function MACD(closes) {
    if(closes.length<35) return {hist:null,sig:'neutral'};
    let ema12=EMA(closes,12), ema26=EMA(closes,26);
    let macdLine = ema12.map((v,i)=>v-ema26[i]);
    let signalLine = EMA(macdLine.slice(25),9);
    let padded = new Array(25).fill(null).concat(signalLine);
    let hist = macdLine.map((v,i)=>v-padded[i]);
    let lastHist = hist[hist.length-1];
    return {hist:lastHist, sig:lastHist>0?'bullish':'bearish'};
}

function Bollinger(closes, p=20, mult=2) {
    let sma = SMA(closes,p);
    let upper=[], lower=[];
    for(let i=p-1;i<closes.length;i++) {
        let slice=closes.slice(i-p+1,i+1);
        let mean=sma[i];
        let variance=slice.reduce((s,v)=>s+Math.pow(v-mean,2),0)/p;
        let std=Math.sqrt(variance);
        upper.push(mean+mult*std);
        lower.push(mean-mult*std);
    }
    let lastUp=upper[upper.length-1], lastLow=lower[lower.length-1], lastSma=sma[sma.length-1];
    return {upper:lastUp, lower:lastLow, sma:lastSma};
}

function analyze() {
    if(candles.length<50) return null;
    let closes = candles.map(c=>c.close);
    let volumes = candles.map(c=>c.volume);
    
    let rsi = RSI(closes);
    let macd = MACD(closes);
    let bb = Bollinger(closes);
    let sma20 = SMA(closes,20);
    let sma50 = SMA(closes,50);
    let lastClose = closes[closes.length-1];
    let prevClose = closes[closes.length-2];
    let change = lastClose - prevClose;
    let changePct = (change/prevClose)*100;
    
    // Momentum 3 candle
    let mom3 = closes.slice(-4).reduce((sum,v,i,a)=>i>0?sum+(v-a[i-1]):0,0);
    let mom5 = closes.slice(-6).reduce((sum,v,i,a)=>i>0?sum+(v-a[i-1]):0,0);
    
    // Volume momentum
    let volAvg5 = volumes.slice(-5).reduce((a,b)=>a+b,0)/5;
    let volAvg10 = volumes.slice(-10,-5).reduce((a,b)=>a+b,0)/5;
    let volSignal = volAvg5>volAvg10*1.3?'bullish':volAvg5<volAvg10*0.7?'bearish':'neutral';
    
    // Scoring system
    let bullish=0, bearish=0, total=0;
    const add = (signal, weight) => {
        total+=weight;
        if(signal==='bullish') bullish+=weight;
        else if(signal==='bearish') bearish+=weight;
        else { bullish+=weight*0.5; bearish+=weight*0.5; }
    };
    add(rsi.sig, 1.5);
    add(macd.sig, 1.5);
    add(sma20[sma20.length-1]>sma50[sma50.length-1]?'bullish':'bearish', 1.2);
    add(lastClose>bb.upper?'bearish':lastClose<bb.lower?'bullish':'neutral', 1.0);
    add(mom3>0?'bullish':mom3<0?'bearish':'neutral', 1.0);
    add(mom5>0?'bullish':mom5<0?'bearish':'neutral', 0.8);
    add(volSignal, 0.7);
    
    let bullPct = (bullish/total)*100;
    let bearPct = (bearish/total)*100;
    
    let signal, conf, color;
    if(bullPct>=75) signal = 'STRONG BUY 🟢';
    else if(bullPct>=60) signal = 'BUY 🟩';
    else if(bullPct>40 && bearPct>40) signal = 'NEUTRAL ⬜';
    else if(bearPct>=75) signal = 'STRONG SELL 🔴';
    else if(bearPct>=60) signal = 'SELL 🟥';
    else signal = 'NEUTRAL ⬜';
    
    conf = Math.max(bullPct, bearPct);
    if(signal.includes('NEUTRAL')) conf = 50;
    
    // Alasan
    let reasons = [];
    if(rsi.val && rsi.val>70) reasons.push('RSI Overbought');
    if(rsi.val && rsi.val<30) reasons.push('RSI Oversold');
    if(macd.hist>0) reasons.push('MACD bullish');
    else reasons.push('MACD bearish');
    if(lastClose<bb.lower) reasons.push('Harga di bawah BB lower');
    if(lastClose>bb.upper) reasons.push('Harga di atas BB upper');
    if(volSignal==='bullish') reasons.push('Volume naik');
    
    return {
        signal, confidence: Math.round(conf), bullPct: Math.round(bullPct), bearPct: Math.round(bearPct),
        changePct, lastClose, rsi: rsi.val, macdHist: macd.hist, bbUpper: bb.upper, bbLower: bb.lower,
        sma20: sma20[sma20.length-1], sma50: sma50[sma50.length-1], reasons: reasons.join(', ')
    };
}

// ========== Mini Chart (Canvas) ==========
function drawMiniChart() {
    const canvas = document.getElementById('miniChart');
    if(!canvas || candles.length<10) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width, h = canvas.height;
    const closes = candles.slice(-50).map(c=>c.close);
    const min = Math.min(...closes)*0.999;
    const max = Math.max(...closes)*1.001;
    const range = max-min;
    ctx.clearRect(0,0,w,h);
    
    // grid
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 0.5;
    for(let i=0;i<5;i++) {
        let y = 20 + (h-40)*(i/4);
        ctx.beginPath(); ctx.moveTo(30,y); ctx.lineTo(w-10,y); ctx.stroke();
    }
    // price line
    ctx.beginPath();
    ctx.strokeStyle = '#f7931a';
    ctx.lineWidth = 2;
    for(let i=0;i<closes.length;i++) {
        let x = 30 + (w-40)*(i/(closes.length-1));
        let y = 20 + (h-40)*(1-(closes[i]-min)/range);
        if(i===0) ctx.moveTo(x,y);
        else ctx.lineTo(x,y);
    }
    ctx.stroke();
    
    // current price dot
    let lastX = 30 + (w-40);
    let lastY = 20 + (h-40)*(1-(closes[closes.length-1]-min)/range);
    ctx.fillStyle = '#f7931a';
    ctx.beginPath(); ctx.arc(lastX, lastY, 4, 0, 2*Math.PI); ctx.fill();
    
    // labels
    ctx.fillStyle = '#94a3b8';
    ctx.font = '10px JetBrains Mono';
    ctx.fillText('$'+max.toFixed(0), 32, 16);
    ctx.fillText('$'+min.toFixed(0), 32, h-5);
}

// ========== Update UI ==========
function updateUI() {
    if(!candles.length) return;
    
    const analysis = analyze();
    if(!analysis) return;
    
    document.getElementById('priceDisplay').textContent = '$' + (currentPrice||analysis.lastClose).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
    const chg = document.getElementById('changeDisplay');
    chg.textContent = (analysis.changePct>=0?'▲':'▼')+' '+Math.abs(analysis.changePct).toFixed(2)+'%';
    chg.className = 'change '+(analysis.changePct>=0?'up':'down');
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString();
    
    // Sinyal
    const sigText = document.getElementById('signalText');
    const prevSignal = sigText.textContent;
    sigText.textContent = analysis.signal;
    sigText.style.color = analysis.signal.includes('BUY')?'var(--green)':analysis.signal.includes('SELL')?'var(--red)':'var(--gold)';
    document.getElementById('confidenceText').textContent = analysis.confidence;
    document.getElementById('confFill').style.width = analysis.confidence+'%';
    document.getElementById('confFill').style.background = analysis.signal.includes('BUY')?'var(--green)':analysis.signal.includes('SELL')?'var(--red)':'var(--gold)';
    document.getElementById('reasonText').textContent = analysis.reasons;
    
    // Jika sinyal berubah (dari bukan NEUTRAL ke BUY/SELL)
    if(prevSignal !== analysis.signal && !analysis.signal.includes('NEUTRAL') && audioEnabled) {
        notifySignal(analysis.signal);
        addLog({signal: analysis.signal, confidence: analysis.confidence});
    }
    
    // Indikator grid
    const grid = document.getElementById('indicatorsGrid');
    grid.innerHTML = [
        {name:'RSI', val:analysis.rsi?.toFixed(2)||'--', sig:analysis.rsi>70?'bearish':analysis.rsi<30?'bullish':'neutral'},
        {name:'MACD Hist', val:analysis.macdHist?.toFixed(2)||'--', sig:analysis.macdHist>0?'bullish':'bearish'},
        {name:'SMA 20', val:analysis.sma20?.toFixed(2)||'--', sig:'neutral'},
        {name:'SMA 50', val:analysis.sma50?.toFixed(2)||'--', sig:'neutral'},
        {name:'BB Upper', val:analysis.bbUpper?.toFixed(2)||'--', sig:'neutral'},
        {name:'BB Lower', val:analysis.bbLower?.toFixed(2)||'--', sig:'neutral'}
    ].map(i=>`
        <div class="ind-card">
            <div class="ind-name">${i.name}</div>
            <div class="ind-val">${i.val}</div>
            <span class="badge ${i.sig==='bullish'?'bull':i.sig==='bearish'?'bear':'neutral'}">${i.sig}</span>
        </div>
    `).join('');
    
    drawMiniChart();
}

// ========== Init ==========
function closeDisclaimer() {
    document.getElementById('disclaimerModal').style.display='none';
    localStorage.setItem('btcbot_disclaimer','accepted');
}

(async function init(){
    if(localStorage.getItem('btcbot_disclaimer')!=='accepted') {
        document.getElementById('disclaimerModal').style.display='flex';
    }
    await fetchKlines();
    connectWS();
    updateUI();
    setInterval(async ()=>{
        await fetchKlines();
        updateUI();
    }, 30000);
})();
</script>
</body>
</html>
