@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap');

body::before{content:'';position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,0.06) 2px,rgba(0,0,0,0.06) 4px);pointer-events:none;z-index:999}

/* LINK */

<script>
// ══ PWA MANIFEST ══
const mfData={name:"BTC Signal — Polymarket 5Min",short_name:"BTC Signal",start_url:location.href,display:"standalone",background_color:"#070b14",theme_color:"#0a0e1a",icons:[{src:"data:image/svg+xml,"+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 192 192'><rect width='192' height='192' rx='36' fill='%230d1220'/><text x='96' y='135' font-family='Arial Black' font-size='115' text-anchor='middle' fill='%2300e5a0'>₿</text></svg>`),sizes:"192x192",type:"image/svg+xml"}]};
const mfBlob=new Blob([JSON.stringify(mfData)],{type:'application/json'});
document.getElementById('mf').href=URL.createObjectURL(mfBlob);

// ══ KONFIGURASI ══
const MIN_CONF = 55; // threshold sinyal

// ══════════════════════════════════════════════════════
// WINDOW TIMING — Polymarket BTC 5-min
// Slug: btc-updown-5m-{unix_timestamp_start}
// Setiap window = 300 detik, mulai dari Unix % 300 === 0
// ══════════════════════════════════════════════════════
function getWindow(){
  const now=Math.floor(Date.now()/1000);
  const start=now-(now%300);     // floor ke 300 terdekat
  const close=start+300;
  const secLeft=close-now;
  return{start,close,secLeft,
    slug:`btc-updown-5m-${start}`,
    // window berikutnya (untuk prefetch)
    nextStart:start+300,
    nextSlug:`btc-updown-5m-${start+300}`
  };
}

// ══ LIVE CLOCK ══
setInterval(()=>{
  const t=document.getElementById('htime');
  if(t) t.textContent=new Date().toLocaleTimeString('id-ID');
},1000);

// ══ FETCH BTC PRICE — multi sumber ══
const PRICE_SOURCES=[
  ()=>fetch('https://api.binance.com/api/v3/ticker/price?symbol=BTCUSDT').then(r=>r.json()).then(d=>+d.price),
  ()=>fetch('https://api.kraken.com/0/public/Ticker?pair=XBTUSD').then(r=>r.json()).then(d=>+d.result.XXBTZUSD.c[0]),
  ()=>fetch('https://api.coinbase.com/v2/prices/BTC-USD/spot').then(r=>r.json()).then(d=>+d.data.amount),
  ()=>fetch('https://min-api.cryptocompare.com/data/price?fsym=BTC&tsym=USD').then(r=>r.json()).then(d=>+d.USD),
  ()=>fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd').then(r=>r.json()).then(d=>+d.bitcoin.usd),
];
async function fetchPrice(){
  for(const fn of PRICE_SOURCES){
    try{const v=await fn();if(v&&v>1000)return v}catch{}
  }
  return null;
}

// ══ FETCH CANDLES (1m) ══
const CANDLE_SOURCES=[
  async()=>{
    const r=await fetch('https://api.binance.com/api/v3/klines?symbol=BTCUSDT&interval=1m&limit=30');
    const d=await r.json();
    return d.map(k=>({time:+k[0]/1000,open:+k[1],high:+k[2],low:+k[3],close:+k[4],vol:+k[5]}));
  },
  async()=>{
    const r=await fetch('https://min-api.cryptocompare.com/data/v2/histominute?fsym=BTC&tsym=USD&limit=30');
    const d=await r.json();
    if(d.Response!=='Success')throw new Error();
    return d.Data.Data.map(c=>({time:c.time,open:c.open,high:c.high,low:c.low,close:c.close,vol:c.volumefrom}));
  },
];
async function fetchCandles(){
  for(const fn of CANDLE_SOURCES){try{const v=await fn();if(v&&v.length>5)return v}catch{}}
  return[];
}

// ══ FETCH POLYMARKET MARKET DATA via Gamma API ══
// Gunakan slug deterministik — tidak perlu scan semua market
async function fetchMarketBySlug(slug){
  try{
    // Coba event endpoint dulu
    const r=await fetch(`https://gamma-api.polymarket.com/events?slug=${slug}&limit=1`);
    const d=await r.json();
    if(d&&d.length>0){
      const ev=d[0];
      const market=ev.markets&&ev.markets[0];
      return market||null;
    }
  }catch{}
  try{
    // Fallback: markets endpoint
    const r=await fetch(`https://gamma-api.polymarket.com/markets?slug=${slug}&limit=1`);
    const d=await r.json();
    if(Array.isArray(d)&&d.length>0)return d[0];
    if(d&&d.data&&d.data.length>0)return d.data[0];
  }catch{}
  return null;
}

async function fetchMid(tokenId){
  try{
    const r=await fetch(`https://clob.polymarket.com/midpoint?token_id=${tokenId}`);
    const d=await r.json();
    return+d.mid;
  }catch{return null}
}

async function getMarketPrices(market){
  if(!market)return null;
  let toks=market.clobTokenIds,outs=market.outcomes;
  try{if(typeof toks==='string')toks=JSON.parse(toks);if(typeof outs==='string')outs=JSON.parse(outs)}catch{}
  if(!toks||toks.length<2)return null;

  // Identifikasi UP dan DOWN token
  let ui=0,di=1;
  if(outs&&outs.length>=2){
    outs.forEach((o,i)=>{
      const ol=o.toLowerCase();
      if(ol==='up'||ol.includes('up'))ui=i;
      else if(ol==='down'||ol.includes('down'))di=i;
    });
  }

  const[up,dn]=await Promise.all([fetchMid(toks[ui]),fetchMid(toks[di])]);
  
  // Ambil "outcomePrices" sebagai fallback
  let outPrices=market.outcomePrices;
  try{if(typeof outPrices==='string')outPrices=JSON.parse(outPrices)}catch{}
  
  return{
    up: up||(outPrices&&+outPrices[ui])||null,
    dn: dn||(outPrices&&+outPrices[di])||null,
    outcomes: outs,
    tokenUp: toks[ui],
    tokenDn: toks[di],
  };
}

// ══ INDIKATOR TEKNIKAL ══
function calcRSI(closes,p=14){
  if(closes.length<p+1)return 50;
  let g=0,l=0;
  for(let i=closes.length-p;i<closes.length;i++){const d=closes[i]-closes[i-1];d>0?g+=d:l-=d}
  if(l===0)return 100;
  return 100-(100/(1+(g/p)/(l/p)));
}
function calcEMA(closes,p){
  if(!closes.length)return 0;
  if(closes.length<p)return closes[closes.length-1];
  const k=2/(p+1);let e=closes.slice(0,p).reduce((a,b)=>a+b)/p;
  for(let i=p;i<closes.length;i++)e=closes[i]*k+e*(1-k);
  return e;
}
function calcMACD(closes){
  const e12=calcEMA(closes,12),e26=calcEMA(closes,26);
  return e12-e26; // MACD line
}
function calcBBands(closes,p=20){
  if(closes.length<p)return{upper:0,lower:0,mid:0};
  const sl=closes.slice(-p);
  const mean=sl.reduce((a,b)=>a+b)/p;
  const std=Math.sqrt(sl.reduce((a,b)=>a+(b-mean)**2,0)/p);
  return{upper:mean+2*std,lower:mean-2*std,mid:mean};
}

// ══ ANALISA UTAMA ══
// Fokus: prediksi UP/DOWN dalam sisa 5 menit window
function analyze(candles, price, priceToBeat){
  if(!candles||candles.length<10||!priceToBeat||!price)return null;
  
  const closes=candles.map(c=>c.close).concat([price]);
  const highs=candles.map(c=>c.high);
  const lows=candles.map(c=>c.low);
  
  let score=0;
  const details=[];

  // ── 1. POSISI VS PRICE TO BEAT (paling penting, bobot 45) ──
  // Ini yang menentukan resolusi Polymarket
  const diffFromPTB=(price-priceTobeat)/priceTobeat*100;
  const ptbScore=Math.max(-45,Math.min(45,diffFromPTB*300));
  score+=ptbScore;
  details.push({n:'vs Price to Beat',v:`${diffFromPTB>=0?'+':''}${diffFromPTB.toFixed(3)}%`,c:ptbScore>=0?'bull':'bear'});

  // ── 2. MOMENTUM 3 MENIT TERAKHIR (bobot 20) ──
  if(closes.length>=4){
    const mom3=(closes[closes.length-1]-closes[closes.length-4])/closes[closes.length-4]*100;
    const mScore=Math.max(-20,Math.min(20,mom3*80));
    score+=mScore;
    details.push({n:'Momentum 3m',v:`${mom3>=0?'+':''}${mom3.toFixed(3)}%`,c:mScore>=0?'bull':'bear'});
  }

  // ── 3. RSI (bobot 15) ──
  const rsiVal=calcRSI(closes);
  let rScore=0;
  if(rsiVal>70){rScore=-10}
  else if(rsiVal<30){rScore=10}
  else if(rsiVal>55){rScore=10}
  else if(rsiVal<45){rScore=-10}
  else rScore=(rsiVal-50)/5*5;
  score+=rScore;
  details.push({n:'RSI 14',v:rsiVal.toFixed(1),c:rScore>0?'bull':rScore<0?'bear':'neut'});

  // ── 4. EMA CROSS 5/13 (bobot 10) ──
  const e5=calcEMA(closes,5),e13=calcEMA(closes,13);
  const eScore=e5>e13?10:-10;
  score+=eScore;
  details.push({n:'EMA 5/13',v:e5>e13?'Bullish':'Bearish',c:e5>e13?'bull':'bear'});

  // ── 5. MACD (bobot 10) ──
  if(closes.length>=26){
    const macd=calcMACD(closes);
    const mScore=macd>0?8:-8;
    score+=mScore;
    details.push({n:'MACD',v:macd>0?'Positif':'Negatif',c:macd>0?'bull':'bear'});
  }

  score=Math.max(-100,Math.min(100,score));
  const conf=Math.abs(score);

  // Bollinger Bands untuk info volatilitas
  const bb=calcBBands(closes);
  const bbPos=bb.upper>bb.lower?(price-bb.lower)/(bb.upper-bb.lower)*100:50;

  return{
    score,conf,
    rsi:rsiVal,ema5:e5,ema13:e13,
    diffFromPTB,
    bbPos,bbUpper:bb.upper,bbLower:bb.lower,
    details,
    priceTobeat,
  };
}

// ══ STATE ══
let S={
  price:null, priceTobeat:null,
  candles:[], market:null,
  upP:null, dnP:null,
  slug:'', marketSlug:'',
  analysis:null,
  win:{start:0,close:0,secLeft:300,slug:''},
  updated:null, loading:true, error:null,
  openPriceCache:{}, // cache open price per window
};

// ══ FETCH ALL ══
async function fetchAll(){
  setDot('');
  S.error=null;
  try{
    const w=getWindow();
    S.win=w;

    // Fetch price + candles paralel
    const[price,candles]=await Promise.all([fetchPrice(),fetchCandles()]);
    if(!price)throw new Error('Gagal ambil harga BTC dari semua sumber. Cek koneksi.');
    
    S.price=price;
    S.candles=candles;
    S.updated=new Date();

    // ── PRICE TO BEAT dari candle ──
    // Cari close candle 1m yang time-nya paling dekat sebelum window start
    // Ini approx harga Chainlink saat window dibuka
    if(!S.openPriceCache[w.start]){
      let ptb=null;
      if(candles.length){
        // Candle yang time-nya >= window start adalah candle pertama window
        for(const c of candles){
          if(c.time>=w.start){ptb=c.open;break}
        }
        // Fallback: close candle terakhir sebelum window
        if(!ptb){
          for(let i=candles.length-1;i>=0;i--){
            if(candles[i].time<w.start){ptb=candles[i].close;break}
          }
        }
      }
      S.openPriceCache[w.start]=ptb||price;
    }
    S.priceTobeat=S.openPriceCache[w.start];

    // ── FETCH MARKET POLYMARKET ──
    // Gunakan slug deterministik
    const market=await fetchMarketBySlug(w.slug);
    S.market=market;
    S.marketSlug=w.slug;

    if(market){
      const prices=await getMarketPrices(market);
      if(prices){S.upP=prices.up;S.dnP=prices.dn}
    }

    // ── ANALISA ──
    S.analysis=analyze(candles,price,S.priceTobeat);
    S.loading=false;
    setDot('live');
  }catch(e){
    S.loading=false;
    S.error=e.message||'Error tidak diketahui';
    setDot('err');
    console.error(e);
  }
  render();
}

function setDot(c){
  const d=document.getElementById('dot');
  if(d)d.className='dot'+(c?' '+c:'');
}

// ══ TIMER — update tiap detik ══
let lastWinStart=0;
function startTimer(){
  setInterval(()=>{
    const w=getWindow();
    S.win=w;
    S.win.secLeft=w.secLeft;

    // Window berganti → fetch ulang semua
    if(w.start!==lastWinStart){
      lastWinStart=w.start;
      // Hapus cache window lama kecuali 2 terakhir
      const keys=Object.keys(S.openPriceCache);
      if(keys.length>3)keys.slice(0,-2).forEach(k=>delete S.openPriceCache[k]);
      fetchAll();
      return;
    }

    // Update timer + price to beat diff saja (tanpa fetch ulang)
    updateLiveElements();
  },1000);
}

function updateLiveElements(){
  // Timer
  const el=document.getElementById('tv');
  const fl=document.getElementById('pf');
  if(el&&fl){
    const s=S.win.secLeft;
    const m=Math.floor(s/60),sc=s%60;
    el.textContent=`${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`;
    el.className='tval '+(s<=30?'urg':s<=90?'wrn':'ok');
    fl.style.width=`${(300-s)/300*100}%`;
  }
  // Window info
  const wi=document.getElementById('wininfo');
  if(wi&&S.win.secLeft){
    wi.textContent=`Window mulai: ${new Date(S.win.start*1000).toLocaleTimeString('id-ID')} → selesai: ${new Date(S.win.close*1000).toLocaleTimeString('id-ID')}`;
  }
}

// ══ RENDER ══
function render(){
  document.getElementById('ldv').style.display='none';
  const main=document.getElementById('main');
  main.style.display='block';

  if(S.error&&!S.price){
    main.innerHTML=`
      <div class="errb fade-in">
        <div class="erri">⚠️</div>
        <div class="errm">${S.error}</div>
        <button class="rbtn" onclick="manualRefresh()" style="margin:0;width:100%">🔄 COBA LAGI</button>
      </div>`;
    return;
  }

  const{price,priceTobeat,analysis,upP,dnP,marketSlug,updated,win}=S;
  const diff=price&&priceTobeat?price-priceTobeat:0;
  const diffPct=priceTobeat&&priceTobeat>0?diff/priceTobeat*100:0;
  const isUp=diff>=0;

  // Sinyal
  let sc='swt',bc='wt',bl='TUNGGU',sd='❓ TUNGGU',sdc='wt',cc='wt',sigDesc='';
  if(analysis){
    if(analysis.conf>=MIN_CONF){
      if(analysis.score>0){
        sc='sup';bc='up';bl='BELI UP';sd='⬆ UP';sdc='up';cc='up';
        sigDesc='Momentum bullish — BTC kemungkinan naik dalam window ini';
      }else{
        sc='sdn';bc='dn';bl='BELI DOWN';sd='⬇ DOWN';sdc='dn';cc='dn';
        sigDesc='Momentum bearish — BTC kemungkinan turun dalam window ini';
      }
    }else{
      sigDesc=`Sinyal belum kuat (${analysis.conf.toFixed(0)}% < ${MIN_CONF}%) — tunggu momentum lebih jelas`;
    }
  }

  const conf=analysis?analysis.conf:0;
  const rsi=analysis?analysis.rsi:50;
  const emaBull=analysis?analysis.ema5>analysis.ema13:false;
  const bbPos=analysis?analysis.bbPos:50;
  const tStr=updated?updated.toLocaleTimeString('id-ID'):'-';
  const s=win.secLeft,m=Math.floor(s/60),sec=s%60;
  const tCls=s<=30?'urg':s<=90?'wrn':'ok';
  const prog=(300-s)/300*100;

  // Payout kalkulasi
  let payoutHtml='';
  if(analysis&&analysis.conf>=MIN_CONF){
    const px=analysis.score>0?upP:dnP;
    if(px&&px>0&&px<1){
      const gain=((1/px-1)*100).toFixed(0);
      const dir=analysis.score>0?'UP':'DOWN';
      payoutHtml=`<div class="payout">Beli ${dir} @ $${px.toFixed(3)} → menang dapat <b>$${(1/px).toFixed(2)}</b> per saham (+${gain}%)</div>`;
    }
  }

  // Indikator detail
  const indRows=analysis&&analysis.details?analysis.details.map(d=>`
    <div class="iitm">
      <div class="inm">${d.n}</div>
      <div class="ivl ${d.c}">${d.v}</div>
    </div>`).join(''):`
    <div class="iitm"><div class="inm">Data</div><div class="ivl neut">Memuat...</div></div>`;

  main.innerHTML=`
  <!-- HARGA BTC -->
  <div class="card card-top fade-in">
    <div class="plb">BTC / USD  LIVE</div>
    <div class="pval"><s>$</s>${price?price.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'---'}</div>
    <div class="pmeta">
      <div class="pm"><div class="pml">RSI</div><div class="pmv ${rsi>55?'up':rsi<45?'dn':'wt'}">${rsi.toFixed(0)}</div></div>
      <div class="pm"><div class="pml">EMA Trend</div><div class="pmv ${emaBull?'up':'dn'}">${emaBull?'▲ Bull':'▼ Bear'}</div></div>
      <div class="pm"><div class="pml">BB Position</div><div class="pmv ${bbPos>70?'dn':bbPos<30?'up':'wt'}">${bbPos.toFixed(0)}%</div></div>
    </div>
  </div>

  <!-- PRICE TO BEAT — kunci resolusi Polymarket -->
  <div class="ptb-box fade-in">
    <div class="ptb-left">
      <div class="ptb-label">📌 PRICE TO BEAT (Chainlink)</div>
      <div class="ptb-val">$${priceTobeat?priceTobeat.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'---'}</div>
    </div>
    <div class="ptb-right">
      <div class="ptb-diff-label">BTC vs Target</div>
      <div class="ptb-diff ${isUp?'up':'dn'}">${isUp?'▲':'▼'} ${Math.abs(diffPct).toFixed(3)}%</div>
    </div>
  </div>

  <!-- TIMER -->
  <div class="card fade-in">
    <div class="trow">
      <div class="plb">⏱ SISA WINDOW</div>
      <div class="tval ${tCls}" id="tv">${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}</div>
    </div>
    <div class="trk"><div class="tfil" id="pf" style="width:${prog}%"></div></div>
    <div class="twin-info" id="wininfo">Window: ${new Date(win.start*1000).toLocaleTimeString('id-ID')} → ${new Date(win.close*1000).toLocaleTimeString('id-ID')}</div>
  </div>

  <!-- SINYAL UTAMA -->
  <div class="sig ${sc} fade-in">
    <div class="bdg ${bc}">SINYAL • ${bl}</div>
    <div class="sigdir ${sdc}">${sd}</div>
    <div class="sigsub">${sigDesc||'Mengumpulkan data analisa...'}</div>
    <div class="crow">
      <div class="clb">Kekuatan Sinyal</div>
      <div class="cpct" style="color:var(--${cc})">${conf.toFixed(0)}%</div>
    </div>
    <div class="ctrk"><div class="cfil ${cc}" style="width:${conf}%"></div></div>
  </div>

  <!-- HARGA TOKEN POLYMARKET -->
  <div class="card fade-in">
    <div class="stitle">💱 Harga Token Polymarket</div>
    <div class="pgrid">
      <div class="pbox upb">
        <div class="pblb up">⬆ UP</div>
        <div class="pbv">${upP?'$'+upP.toFixed(3):'-'}</div>
        <div class="pbp">${upP?(upP*100).toFixed(1)+'%':'-'}</div>
      </div>
      <div class="pbox dnb">
        <div class="pblb dn">⬇ DOWN</div>
        <div class="pbv">${dnP?'$'+dnP.toFixed(3):'-'}</div>
        <div class="pbp">${dnP?(dnP*100).toFixed(1)+'%':'-'}</div>
      </div>
    </div>
    ${payoutHtml}
  </div>

  <!-- INDIKATOR -->
  <div class="card fade-in">
    <div class="stitle">📊 Detail Indikator</div>
    <div class="igrd">${indRows}</div>
  </div>

  <!-- LINK POLYMARKET -->
  <a class="lnk fade-in" href="https://polymarket.com/event/${marketSlug||'btc-updown-5m-'+win.start}" target="_blank">
    <div class="ltxt">
      <small>🔗 BUKA MARKET INI DI POLYMARKET</small>
      ${marketSlug||'btc-updown-5m-'+win.start}
    </div>
    <span style="font-size:18px">↗</span>
  </a>

  <button class="rbtn" id="rbtn" onclick="manualRefresh()">🔄 REFRESH MANUAL</button>
  <div class="upd">Update: ${tStr} • Auto tiap window baru (5 menit)</div>
  `;
}

// ══ MANUAL REFRESH ══
async function manualRefresh(){
  const b=document.getElementById('rbtn');
  if(b){b.disabled=true;b.innerHTML='⏳ Memuat...'}
  S.error=null;
  await fetchAll();
}

// ══ INIT ══
fetchAll();
startTimer();
</script>
</body>
</html>
